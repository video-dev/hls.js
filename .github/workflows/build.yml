name: Build

on:
  push:
    branches: [master]
    tags: ['v*']

permissions: {}

concurrency:
  group: 'build:${{ github.ref }}'
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.extract_tag.outputs.result }}
      isMainBranch: ${{ github.ref == 'refs/heads/master' }}
    steps:
      - name: extract tag
        id: extract_tag
        uses: actions/github-script@v9
        with:
          script: |
            const prefix = 'refs/tags/';
            const ref = context.ref;
            return ref.startsWith(prefix) ? ref.substring(prefix.length) : '';
          result-encoding: string

  test:
    needs: config
    uses: ./.github/workflows/shared-test.yml
    with:
      ref: ${{ github.sha }}
      tag: ${{ needs.config.outputs.tag }}
    secrets:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

  cloudflare_pages:
    needs: [config, test]
    if: needs.config.outputs.tag || needs.config.outputs.isMainBranch == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: cache node_modules
        uses: actions/cache@v6
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: download build
        uses: actions/download-artifact@v5
        with:
          name: build

      - name: install
        run: |
          npm ci
        env:
          CI: true

      - name: build for CloudFlare
        run: |
          ./scripts/build-cloudflare.sh
        env:
          CI: true

      - name: deploy to CloudFlare
        run: |
          ./scripts/deploy-cloudflare.sh
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  update_draft_release:
    needs: [config, test]
    if: needs.config.outputs.tag
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.draft_release.outputs.upload_url }}
    permissions:
      contents: write
    steps:
      - name: draft release notes
        id: draft_release
        uses: tjenkinson/release-drafter@349214e6b3b889d8b333c012cc61a1f1753baf40
        with:
          tag: ${{ needs.config.outputs.tag }}
          name: ${{ needs.config.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release_github:
    needs: [config, test, update_draft_release]
    if: needs.config.outputs.tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: download build
        uses: actions/download-artifact@v5
        with:
          name: build

      - name: build release zip
        run: |
          zip -r dist.zip dist

      - name: upload assets to github release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.update_draft_release.outputs.upload_url }}
          asset_path: dist.zip
          asset_name: release.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release_npm:
    # npm oidc is configured for this environment
    # https://docs.npmjs.com/trusted-publishers#for-github-actions
    environment: release
    needs: [config, test]
    if: needs.config.outputs.tag || needs.config.outputs.isMainBranch == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: cache node_modules
        uses: actions/cache@v6
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: download build
        uses: actions/download-artifact@v5
        with:
          name: build

      - name: install
        run: |
          npm ci
        env:
          CI: true

      - name: publish to npm
        run: |
          ./scripts/publish-npm.sh
        env:
          CI: true
          TAG: ${{ needs.config.outputs.tag }}
